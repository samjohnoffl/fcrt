# Render Blueprint for FCRT (free tier).
#
#   Render dashboard → New → Blueprint → point at this repository.
#
# One free web service runs the API *and* the job worker, via the `/fcrt-all`
# launcher. Render's free plan has no background workers, so a second service
# for `cmd/worker` is not an option; `/fcrt-all` starts both binaries in the one
# container and supervises them (see cmd/all/main.go).
#
# The database is NOT on Render: free Render Postgres expires 30 days after
# creation, which would take the data with it. Use Neon's free tier instead,
# which does not expire:
#
#   neon.tech → New project → copy the connection string into DATABASE_URL
#
# Migrations do not run at boot. Apply them once before the first deploy, and
# again after any schema change, from a machine with Docker:
#
#   docker build -t fcrt .
#   docker run --rm -e DATABASE_URL='<neon-connection-string>' fcrt /migrate up
#
# The free plan spins the service down after 15 minutes without traffic, so the
# first request after a pause takes about a minute; the worker starts with the
# container and drains queued jobs once it is up.
#
# Secrets marked `sync: false` are prompted for in the dashboard and never live
# in the repository.

services:
  - type: web
    name: fcrt-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Runs the API and the worker together — see the note above.
    dockerCommand: /fcrt-all
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: API_PORT
        value: "8080"
      - key: AUTH_MODE
        value: local
      - key: AUTH_SESSION_TTL_HOURS
        value: "12"
      - key: MIGRATIONS_DIR
        value: /migrations
      - key: LOG_LEVEL
        value: info
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: WORKER_POLL_INTERVAL_SECONDS
        value: "5"
      # Required secrets — set these in the dashboard.
      - key: DATABASE_URL
        sync: false
      - key: AUTH_USERS
        sync: false
      - key: AUTH_SESSION_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # The deployed frontend origin, so the browser may call the API.
      - key: CORS_ORIGINS
        sync: false
